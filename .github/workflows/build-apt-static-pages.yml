name: Publish APT repo to GitHub Pages

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        if: github.ref_protected == true
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: Set up just
              uses: extractions/setup-just@v4

            - name: Install packaging tools
              run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg

            - name: Import GPG signing key
              shell: bash
              env:
                  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  echo "$GPG_PRIVATE_KEY" | gpg --batch --import
                  fingerprint=$(gpg --list-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
                  echo "${fingerprint}:6:" | gpg --import-ownertrust

            - name: Build binaries
              shell: bash
              env:
                  FLOTTE_VERSION: ${{ github.ref_name }}
                  FLOTTE_PLATFORMS: linux/amd64 linux/arm64
              run: just build-all

            - name: Build signed APT repo
              shell: bash
              env:
                  GPG_SIGN: "true"
              run: |
                  set -euo pipefail
                  bash .github/apt-config/build.sh public "${GITHUB_REF_NAME#v}"

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy Pages
              id: deployment
              uses: actions/deploy-pages@v5
