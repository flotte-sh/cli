name: CI

on:
    workflow_dispatch:
    pull_request:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

jobs:
    build-test-package:
        name: Build, Test, and Package
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: Set up just
              uses: extractions/setup-just@v4

            - name: Run tests
              run: just test

            - name: Run linters
              shell: bash
              run: |
                  set -euo pipefail

                  unformatted="$(gofmt -l .)"
                  if [ -n "${unformatted}" ]; then
                    echo 'The following files need gofmt:'
                    echo "${unformatted}"
                    exit 1
                  fi

                  go install honnef.co/go/tools/cmd/staticcheck@ff63afafc529279f454e02f1d060210bd4263951
                  just lint

            - name: Build release bundle
              shell: bash
              env:
                  FLOTTE_VERSION: ${{ github.ref_name }}
              run: just release-bundle

            - name: Upload release bundle
              uses: actions/upload-artifact@v7
              if: github.ref_type == 'tag'
              with:
                  name: release-bundle
                  if-no-files-found: error
                  path: |
                      dist/flotte_linux_amd64.tar.gz
                      dist/flotte_linux_amd64.tar.gz.sha256
                      dist/flotte_linux_arm64.tar.gz
                      dist/flotte_linux_arm64.tar.gz.sha256
                      dist/flotte_linux_arm.tar.gz
                      dist/flotte_linux_arm.tar.gz.sha256
                      dist/flotte_linux_386.tar.gz
                      dist/flotte_linux_386.tar.gz.sha256
                      dist/flotte_darwin_amd64.tar.gz
                      dist/flotte_darwin_amd64.tar.gz.sha256
                      dist/flotte_darwin_arm64.tar.gz
                      dist/flotte_darwin_arm64.tar.gz.sha256
                      dist/flotte_windows_amd64.zip
                      dist/flotte_windows_amd64.zip.sha256
                      dist/flotte_windows_arm64.zip
                      dist/flotte_windows_arm64.zip.sha256

    release:
        name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        needs:
            - build-test-package
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download release bundle
              uses: actions/download-artifact@v8
              with:
                  name: release-bundle
                  path: artifacts/release-bundle

            - name: Publish release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.ref_name }}
                  generate_release_notes: true
                  fail_on_unmatched_files: true
                  files: |
                      artifacts/release-bundle/flotte_linux_amd64.tar.gz
                      artifacts/release-bundle/flotte_linux_amd64.tar.gz.sha256
                      artifacts/release-bundle/flotte_linux_arm64.tar.gz
                      artifacts/release-bundle/flotte_linux_arm64.tar.gz.sha256
                      artifacts/release-bundle/flotte_linux_arm.tar.gz
                      artifacts/release-bundle/flotte_linux_arm.tar.gz.sha256
                      artifacts/release-bundle/flotte_linux_386.tar.gz
                      artifacts/release-bundle/flotte_linux_386.tar.gz.sha256
                      artifacts/release-bundle/flotte_darwin_amd64.tar.gz
                      artifacts/release-bundle/flotte_darwin_amd64.tar.gz.sha256
                      artifacts/release-bundle/flotte_darwin_arm64.tar.gz
                      artifacts/release-bundle/flotte_darwin_arm64.tar.gz.sha256
                      artifacts/release-bundle/flotte_windows_amd64.zip
                      artifacts/release-bundle/flotte_windows_amd64.zip.sha256
                      artifacts/release-bundle/flotte_windows_arm64.zip
                      artifacts/release-bundle/flotte_windows_arm64.zip.sha256
