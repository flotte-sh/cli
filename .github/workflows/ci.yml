name: CI

on:
    workflow_dispatch:
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    check:
        name: Format, Lint, Test, and Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: Set up just
              uses: extractions/setup-just@v4

            - name: Check formatting
              shell: bash
              run: |
                  set -euo pipefail

                  unformatted="$(gofmt -l .)"
                  if [ -n "${unformatted}" ]; then
                    echo 'The following files need gofmt:'
                    echo "${unformatted}"
                    exit 1
                  fi

            - name: Run linters
              shell: bash
              run: |
                  set -euo pipefail

                  go install honnef.co/go/tools/cmd/staticcheck@ff63afafc529279f454e02f1d060210bd4263951
                  just lint

            - name: Run tests
              run: just test

            - name: Build all platforms
              run: just build-all
