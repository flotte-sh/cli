name: Gosec

on:
    workflow_dispatch:
    pull_request:
    push:

permissions:
    contents: read

jobs:
    gosec:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - name: Install gosec
              run: go install github.com/securego/gosec/v2/cmd/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0

            - name: Run gosec
              shell: bash
              run: |
                  set -euo pipefail
                  "$(go env GOPATH)/bin/gosec" -fmt golint ./...
