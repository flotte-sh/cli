name: Publish APT repo to GitHub Pages

# Called by release.yml after tests pass and the release is published, so it packages
# the same binaries that were attached to the release.
on:
    workflow_call:
        secrets:
            GPG_PRIVATE_KEY:
                required: true

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: apt-pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Download release bundle
              uses: actions/download-artifact@v8
              with:
                  name: release-bundle
                  path: dist

            - name: Unpack Linux binaries
              shell: bash
              working-directory: dist
              run: |
                  set -euo pipefail
                  for arch in amd64 arm64; do
                    sha256sum -c "flotte_linux_${arch}.tar.gz.sha256"
                    tar -xzf "flotte_linux_${arch}.tar.gz"
                  done

            - name: Install packaging tools
              run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg

            # The private key is imported only after everything above has run,
            # and removed before anything is uploaded.
            - name: Import GPG signing key
              shell: bash
              env:
                  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  echo "$GPG_PRIVATE_KEY" | gpg --batch --import
                  fingerprint=$(gpg --list-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
                  echo "${fingerprint}:6:" | gpg --import-ownertrust

            - name: Build signed APT repo
              shell: bash
              env:
                  GPG_SIGN: "true"
              run: bash .github/apt-config/build.sh public "${GITHUB_REF_NAME#v}"

            - name: Remove GPG signing key
              if: always()
              shell: bash
              run: |
                  gpgconf --kill all || true
                  rm -rf "$HOME/.gnupg"

            - name: Verify APT repo
              shell: bash
              run: bash .github/apt-config/verify.sh public "${GITHUB_REF_NAME#v}"

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy Pages
              id: deployment
              uses: actions/deploy-pages@v5
