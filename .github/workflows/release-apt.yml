name: Publish APT repo to GitHub Pages

# Called by release.yml after tests pass and the release is published, so it packages
# the same binaries that were attached to the release. Can also be run manually from
# main to republish an existing release from its attached assets.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag, such as v0.0.2
                required: true
                type: string
    workflow_call:
        secrets:
            GPG_PRIVATE_KEY:
                required: true

permissions:
    contents: read

concurrency:
    group: apt-pages
    cancel-in-progress: false

jobs:
    build:
        # Manual runs sign and publish, so only allow them from main.
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        env:
            TAG: ${{ inputs.tag || github.ref_name }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download release bundle
              if: ${{ !inputs.tag }}
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release-bundle
                  path: dist

            - name: Download existing release assets
              if: ${{ inputs.tag }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'flotte_linux_*'

            - name: Unpack Linux binaries
              shell: bash
              working-directory: dist
              run: |
                  set -euo pipefail
                  for arch in amd64 arm64; do
                    sha256sum -c "flotte_linux_${arch}.tar.gz.sha256"
                    tar -xzf "flotte_linux_${arch}.tar.gz"
                  done

            - name: Install packaging tools
              run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg

            # The private key is imported only after everything above has run,
            # and removed before anything is uploaded.
            - name: Import GPG signing key
              shell: bash
              env:
                  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  echo "$GPG_PRIVATE_KEY" | gpg --batch --import
                  fingerprint=$(gpg --list-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
                  echo "${fingerprint}:6:" | gpg --import-ownertrust

            - name: Build signed APT repo
              shell: bash
              env:
                  GPG_SIGN: "true"
              run: bash .github/apt-config/build.sh public "${TAG#v}"

            - name: Remove GPG signing key
              if: always()
              shell: bash
              run: |
                  gpgconf --kill all || true
                  rm -rf "$HOME/.gnupg"

            - name: Verify APT repo
              shell: bash
              run: bash .github/apt-config/verify.sh public "${TAG#v}"

            # Debian 13's apt verifies with Sequoia (sqv), which is stricter than gpg.
            - name: Verify APT repo on Debian 13
              shell: bash
              run: |
                  set -euo pipefail
                  docker run --rm \
                    -e "VERSION=${TAG#v}" \
                    -v "$PWD/public:/repo:ro" \
                    -v "$PWD/.github/apt-config/verify.sh:/verify.sh:ro" \
                    debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6 \
                    bash -c 'set -euo pipefail
                      apt-get update -qq
                      apt-get install -y -qq --no-install-recommends python3 >/dev/null
                      command -v sqv
                      bash /verify.sh /repo "$VERSION"'

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Deploy Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
