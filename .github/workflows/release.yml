name: Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

jobs:
    ci:
        name: CI
        uses: ./.github/workflows/ci.yml

    build:
        name: Build release bundle
        needs:
            - ci
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - name: Set up just
              uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

            - name: Build release bundle
              env:
                  FLOTTE_VERSION: ${{ github.ref_name }}
              run: just release-bundle

            - name: Upload release bundle
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-bundle
                  if-no-files-found: error
                  path: |
                      dist/*.tar.gz
                      dist/*.tar.gz.sha256
                      dist/*.zip
                      dist/*.zip.sha256

    github:
        name: GitHub release
        needs:
            - build
        permissions:
            contents: write
        uses: ./.github/workflows/release-github.yml

    apt:
        name: APT repo
        # Tags must be protected: this publishes signed packages to users.
        if: github.ref_protected
        needs:
            - github
        permissions:
            contents: read
            pages: write
            id-token: write
        uses: ./.github/workflows/release-apt.yml
        secrets:
            GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

    winget:
        name: WinGet
        needs:
            - github
        uses: ./.github/workflows/release-winget.yml
        secrets:
            WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

    brew:
        name: Homebrew
        # Tags must be protected: this pushes straight to users with no review.
        if: github.ref_protected
        needs:
            - github
        uses: ./.github/workflows/release-brew.yml
        secrets:
            HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
